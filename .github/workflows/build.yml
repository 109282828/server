name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" || true
          
      - name: Download Gradle 8.0
        run: |
          wget https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          
      - name: Build APK
        run: |
          # Собираем DEBUG версию, она подписывается сама
          ./gradle-8.0/bin/gradle assembleDebug
          
      - name: Rename and Move APK
        run: |
          mkdir -p output
          # Ищем дебажный apk и переименовываем
          find app/build/outputs/apk/debug -name "*.apk" -exec cp {} output/Nerogram.apk \;
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nerogram-Debug
          path: output/Nerogram.apk
